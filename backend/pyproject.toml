[project]
name = "walli-backend"
version = "0.1.0"
description = "Walli - internal AI assistant for laWALL that drafts email replies"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib>=1.7.4",
    # passlib 1.7.4 (unmaintained) breaks with bcrypt>=4.1 (removed `__about__`); pin below that.
    "bcrypt>=4.0,<4.1",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "celery>=5.4",
    "redis>=5.0",
    "tenacity>=8.2",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "openai>=1.30",
    "httpx>=0.27",
    "langfuse>=2.36",
    "beautifulsoup4>=4.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008 (function call in argument default) is the standard FastAPI dependency-injection
# idiom (Depends(...), File(...)); it is not a bug in this codebase.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
